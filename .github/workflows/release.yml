name: Build Windows EXE

# 打 tag（如 v1.0.0）或手动触发时，构建免安装的 Windows 可执行文件并发布到 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download static ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          # BtbN 静态构建；如失效请更新为具体版本号
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin\ffmpeg.exe

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "cantonese-subtitle-tool" --add-binary "bin/ffmpeg.exe;bin" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cantonese-subtitle-tool-win64
          path: dist/cantonese-subtitle-tool.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cantonese-subtitle-tool.exe
