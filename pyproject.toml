[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cantonese-subtitle-tool"
version = "1.0.0"
description = "粤语视频/音频 → 识别粤语字幕 → 翻译普通话 → 双语字幕烧录进视频"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SunnyK-elf" }]
keywords = ["cantonese", "subtitle", "asr", "translation", "ffmpeg", "粤语", "字幕"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "dashscope>=1.20.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0.0"]

[project.scripts]
cantonese-subtitle = "cantonese_tool.cli:main"

[project.urls]
Homepage = "https://github.com/SunnyK-elf/cantonese-subtitle-tool"
Issues = "https://github.com/SunnyK-elf/cantonese-subtitle-tool/issues"

[tool.setuptools]
packages = ["cantonese_tool"]
